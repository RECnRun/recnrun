name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          version: "1.3.0"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Verify
        run: vp run verify
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification
          path: .artifacts/docker/
          include-hidden-files: true
          retention-days: 14
      # verify builds inside its container; this build is the one that ships.
      - name: Build website
        run: vp run website#build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
