name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

# A push and its pull request share one group, so one commit runs CI once.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # verify runs every experiment in Docker; the experiments alone take about 27 minutes here.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          version: "1.3.0"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Verify
        run: vp run verify
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: .artifacts/docker/
          include-hidden-files: true
          retention-days: 14
