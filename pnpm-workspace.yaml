packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@playwright/test": 1.64.1
  "@preact/preset-vite": ^2.10.6
  "@swc/core": ^1.16.18
  "@types/node": ^24.0.0
  "@valibot/to-json-schema": ^1.8.0
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  dependency-cruiser: ^18.7.0
  eslint-plugin-sonarjs: ^4.2.2
  jscpd: ^5.4.1
  knip: ^6.42.1
  oxfmt: 0.73.0
  playwright-core: 1.64.1
  preact: ^11.0.1
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  yaml: ^2.9.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@swc/core": true
minimumReleaseAgeExclude:
  - dependency-cruiser@18.7.0
  - knip@6.42.1
